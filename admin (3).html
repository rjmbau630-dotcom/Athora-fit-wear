<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Athora Fit — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--bg2:#0e0e0d;--bg3:#161513;--bg4:#201f1c;
  --border:rgba(212,175,55,.14);--border2:rgba(255,255,255,.08);
  --text:#F5F1E6;--muted:rgba(245,241,230,.45);--muted2:rgba(245,241,230,.68);
  --accent:#D4AF37;--accent-light:#F4D76A;--red:#ff4d4d;--green:#00e29a;--orange:#ffab2e;
  --gold-grad:linear-gradient(135deg,#F4D76A 0%,#D4AF37 45%,#a9821f 100%);
  --shadow-lux:0 20px 60px rgba(0,0,0,.55);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;line-height:1.6;}

/* LOGIN */
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
#login.hide{display:none;}
.login-card{background:var(--bg2);border:1px solid var(--border2);padding:52px 44px;text-align:center;max-width:420px;width:100%;}
.login-logo{height:110px;object-fit:contain;margin-bottom:28px;filter:drop-shadow(0 0 30px rgba(212,175,55,.4));}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:4px;margin-bottom:4px;}
.login-sub{color:var(--muted2);font-size:13px;margin-bottom:36px;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
.login-input{width:100%;padding:18px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);font-size:28px;text-align:center;letter-spacing:14px;outline:none;font-family:'Share Tech Mono',monospace;transition:border-color .15s;margin-bottom:16px;border-radius:0;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:18px;background:var(--gold-grad);color:#050505;border-radius:8px;border:none;font-family:'Barlow',sans-serif;font-size:16px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:3px;transition:all .15s;}
.login-btn:hover{background:var(--accent-light);box-shadow:0 8px 26px rgba(212,175,55,.35);}
.login-err{color:var(--red);font-size:12px;margin-top:14px;font-family:'Share Tech Mono',monospace;letter-spacing:1px;min-height:18px;}

/* DASHBOARD */
#dash{display:none;min-height:100vh;}
#dash.show{display:block;}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,10,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;}
.tb-left{display:flex;align-items:center;gap:14px;}
.tb-logo{height:38px;object-fit:contain;}
.tb-title{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);}
.tb-right{display:flex;align-items:center;gap:4px;}
.tab-btn{background:none;border:none;color:var(--muted2);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;cursor:pointer;transition:all .15s;}
.tab-btn:hover{color:var(--text);background:var(--bg3);}
.tab-btn.on{color:var(--accent-light);background:rgba(212,175,55,.08);border-bottom:2px solid var(--accent);}
.logout{background:rgba(255,48,48,.08);color:var(--red);border:1px solid rgba(255,48,48,.2);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;cursor:pointer;transition:all .15s;}
.logout:hover{background:var(--red);color:#fff;}

/* CONTENT */
.main{max-width:1320px;margin:0 auto;padding:44px 32px;}
.tab{display:none;animation:fadeIn .2s ease;}
.tab.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec-eye{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent);}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,72px);line-height:.9;margin-bottom:32px;letter-spacing:1px;}
.sec-title em{font-style:normal;color:var(--accent);}
.row-hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:44px;}
.sc{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--accent);padding:22px;}
.sc.g{border-left-color:var(--green);}
.sc.o{border-left-color:var(--orange);}
.sc.r{border-left-color:var(--red);}
.sc-num{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--accent);line-height:1;}
.sc.g .sc-num{color:var(--green);}
.sc.o .sc-num{color:var(--orange);}
.sc.r .sc-num{color:var(--red);}
.sc-lbl{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);margin-top:4px;}

/* ORDER CARDS */
.order-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.of-btn{background:var(--bg2);border:1px solid var(--border2);color:var(--muted2);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:7px 14px;cursor:pointer;transition:all .15s;}
.of-btn:hover{border-color:var(--accent);color:var(--accent);}
.of-btn.on{background:var(--accent);color:#000;border-color:var(--accent);}
.oc{background:var(--bg2);border:1px solid var(--border);padding:22px 26px;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;transition:border-color .15s;}
.oc:hover{border-color:var(--border2);}
.oc-id{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--accent);line-height:1;}
.oc-ref{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px;}
.oc-items{font-size:14px;color:var(--muted2);margin-top:6px;}
.oc-meta{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7;}
.oc-sms{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:6px;}
.sms-fail{color:#ff4d4d;cursor:pointer;text-decoration:underline;}
.oc-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;}
.oc-total{font-family:'Share Tech Mono',monospace;font-size:18px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.badge:hover{opacity:.75;}
.b-p{background:rgba(212,175,55,.1);color:var(--accent-light);border-color:rgba(212,175,55,.25);}
.b-pa{background:rgba(0,255,136,.1);color:var(--green);border-color:rgba(0,255,136,.2);}
.b-pk{background:rgba(255,149,0,.1);color:var(--orange);border-color:rgba(255,149,0,.2);}
.b-d{background:rgba(0,255,136,.15);color:var(--green);border-color:rgba(0,255,136,.3);}

/* PRODUCT GRID */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.pc{background:var(--bg2);border:1px solid var(--border);transition:border-color .15s;overflow:hidden;}
.pc:hover{border-color:var(--border2);}
.pc-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg3);}
.pc-ph{width:100%;aspect-ratio:16/9;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--border2);}
.pc-body{padding:16px;}
.pc-cat{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.pc-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;margin-bottom:4px;}
.pc-price{font-family:'Share Tech Mono',monospace;font-size:15px;margin-bottom:8px;}
.pc-sizes{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:14px;letter-spacing:1px;}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.stk-tog{display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.tog{width:36px;height:20px;background:var(--border2);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0;}
.tog.on{background:var(--green);}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .2s;}
.tog.on::after{transform:translateX(16px);}

/* ADD FORM */
.add-form{background:var(--bg2);border:1px solid var(--border);padding:36px;}
.fg{margin-bottom:20px;}
.fg label{display:block;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.fg input,.fg select,.fg textarea{width:100%;padding:13px 16px;background:var(--bg3);color:var(--text);border:1px solid var(--border2);font-family:'Barlow',sans-serif;font-size:15px;outline:none;transition:border-color .15s;appearance:none;resize:none;border-radius:0;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);}
.fg input::placeholder,.fg textarea::placeholder{color:var(--muted);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.form-full{grid-column:1/-1;}
.uz{border:2px dashed var(--border2);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;position:relative;margin-bottom:20px;}
.uz:hover{border-color:var(--accent);background:rgba(212,175,55,.04);}
.uz input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.uz-ico{font-size:40px;margin-bottom:10px;}
.uz p{font-size:14px;color:var(--muted2);}
.uz-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.prev-img{width:100%;aspect-ratio:16/9;object-fit:cover;margin-bottom:10px;border:1px solid var(--border2);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 22px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:1px;border-radius:0;}
.btn-p{background:var(--gold-grad);color:#050505;border-radius:8px;}.btn-p:hover{background:var(--accent-light);box-shadow:0 8px 22px rgba(212,175,55,.35);}
.btn-g{background:transparent;color:var(--text);border:1px solid var(--border2);}.btn-g:hover{border-color:var(--accent);color:var(--accent);}
.btn-d{background:rgba(255,48,48,.08);color:var(--red);border:1px solid rgba(255,48,48,.2);}.btn-d:hover{background:var(--red);color:#fff;}
.btn-sm{padding:7px 14px;font-size:11px;}
.btn-lg{padding:16px 36px;font-size:15px;}
.btn-fw{width:100%;}

/* RECEIPT MODAL */
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.receipt{background:var(--bg2);border:1px solid var(--border2);max-width:480px;width:100%;overflow:hidden;animation:fadeIn .25s;}
.rh{background:var(--gold-grad);padding:30px;text-align:center;}
.rh img{height:64px;object-fit:contain;margin-bottom:10px;}
.rh h2{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#000;letter-spacing:3px;}
.rb{padding:28px;}
.rl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.rl:last-child{border-bottom:none;}
.rl .lbl{color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;}
.rl .val{font-weight:500;text-align:right;max-width:55%;}
.rt{display:flex;justify-content:space-between;padding:14px 0;font-family:'Bebas Neue',sans-serif;font-size:28px;}
.rt .val{color:var(--accent);}
.rf{padding:16px 28px 28px;display:flex;gap:10px;}

/* TOAST */
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:12px 24px;font-size:13px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.8);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .35s;opacity:0;white-space:nowrap;font-family:'Share Tech Mono',monospace;letter-spacing:1px;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty h3{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--muted2);margin-bottom:8px;letter-spacing:1px;}

@media(max-width:768px){
  .topbar{padding:0 16px;}.tb-title{display:none;}
  .main{padding:28px 16px;}
  .form-row{grid-template-columns:1fr;}
  .stats{grid-template-columns:1fr 1fr;}
  .tab-btn{padding:8px 10px;font-size:9px;}
}
@media print{.topbar,#toast,.rf,.oc-right button{display:none!important;}}

/* ══ LUXURY UPGRADE LAYER — additive only ══ */
::selection{background:var(--accent);color:#050505;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.login-card,.sc,.oc,.pc,.add-form,.receipt{border-radius:12px;}
.login-card{box-shadow:var(--shadow-lux);backdrop-filter:blur(10px);}
.topbar{backdrop-filter:blur(20px) saturate(140%);box-shadow:0 1px 0 rgba(212,175,55,.06);}
.tab-btn{border-radius:6px;}
.tab-btn:hover{background:rgba(212,175,55,.08);}
.sc{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;}
.sc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lux);}
.oc,.pc{transition:border-color .25s,transform .25s;}
.pc:hover{transform:translateY(-3px);}
.fg input,.fg select,.fg textarea,.login-input{border-radius:8px;}
.btn,.btn-sm,.btn-lg{border-radius:8px;}
.tog.on{background:var(--gold-grad);}

/* ══════════════════════════════════════════════════════
   APPLE UI LAYER — additive only, zero JS/ID/class
   dependencies touched, zero colour values changed.
   ══════════════════════════════════════════════════════ */
:root{--ease-spring:cubic-bezier(.16,1,.3,1);--ease-out:cubic-bezier(.22,1,.36,1);}
*{-webkit-tap-highlight-color:transparent;}

.topbar{height:64px;padding:0 28px;backdrop-filter:blur(26px) saturate(160%);}
.tab-btn{border-radius:980px;padding:9px 16px;transition:background .25s var(--ease-out),color .25s var(--ease-out),transform .15s var(--ease-spring);}
.tab-btn:active{transform:scale(.94);}
.logout{border-radius:980px;transition:all .25s var(--ease-out),transform .15s var(--ease-spring);}
.logout:active{transform:scale(.94);}

.btn,.btn-sm,.btn-lg{border-radius:980px!important;transition:background .25s var(--ease-out),box-shadow .25s var(--ease-out),transform .15s var(--ease-spring)!important;}
.btn:active,.btn-sm:active,.btn-lg:active{transform:scale(.96);}
.btn-p:hover{transform:translateY(-1px);}
.of-btn{border-radius:980px;transition:all .2s var(--ease-out);}
.of-btn:active{transform:scale(.93);}
.badge{border-radius:980px;transition:all .2s var(--ease-out);}

.login-card,.sc,.oc,.pc,.add-form{border-radius:22px!important;transition:transform .5s var(--ease-spring),box-shadow .5s var(--ease-spring),border-color .5s var(--ease-out)!important;}
.sc:hover{transform:translateY(-6px) scale(1.015);}
.pc:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,55,.12);}
.pc-img,.pc-ph{border-radius:22px 22px 0 0;}

.fg input,.fg select,.fg textarea,.login-input{border-radius:14px!important;transition:border-color .25s var(--ease-out),box-shadow .25s var(--ease-out);}
.fg input:focus,.fg select:focus,.fg textarea:focus,.login-input:focus{box-shadow:0 0 0 4px rgba(212,175,55,.12);}
.uz{border-radius:18px;transition:all .25s var(--ease-out);}

.modal{backdrop-filter:blur(18px);}
.receipt{border-radius:26px!important;overflow:hidden;animation:appleIn .45s var(--ease-spring);}
.rh{border-radius:26px 26px 0 0;}
@keyframes appleIn{from{opacity:0;transform:scale(.92) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}

#toast{border-radius:980px;transition:transform .5s var(--ease-spring),opacity .4s var(--ease-out);}
.tab.on{animation:appleIn .4s var(--ease-spring);}
.tog{transition:background .25s var(--ease-out);}
.tog::after{transition:transform .3s var(--ease-spring);}

@media(prefers-reduced-motion:reduce){
  .pc,.sc,.oc,.btn,.tab-btn,.logout{transition:none!important;}
}
</style>
</head>

    <!-- OVERVIEW -->
    <div class="tab on" id="tab-overview">
      <div class="sec-eye">// Business Summary</div>
      <div class="sec-title">OVER<em>VIEW</em></div>
      <div class="stats" id="stats"></div>
      <div class="sec-eye" style="margin-bottom:8px;">// Recent Activity</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;margin-bottom:20px;letter-spacing:1px;">RECENT <em style="font-style:normal;color:var(--accent);">ORDERS</em></div>
      <div id="recent"></div>
    </div>

    <!-- ORDERS -->
    <div class="tab" id="tab-orders">
      <div class="row-hd">
        <div><div class="sec-eye">// All Orders</div><div class="sec-title">ALL <em>ORDERS</em></div></div>
        <button class="btn btn-g" onclick="loadAll()">↻ Refresh</button>
      </div>
      <div class="order-filters">
        <button class="of-btn on" onclick="filterOrders('all',this)">All</button>
        <button class="of-btn" onclick="filterOrders('pending',this)">⏳ Pending</button>
        <button class="of-btn" onclick="filterOrders('paid',this)">✓ Paid</button>
        <button class="of-btn" onclick="filterOrders('packed',this)">📦 Packed</button>
        <button class="of-btn" onclick="filterOrders('delivered',this)">🚚 Delivered</button>

    <div class="tab" id="tab-products">

        <div><div class="sec-eye">// Inventory</div><div class="sec-title">PROD<em>UCTS</em></div></div>
        <button class="btn btn-p" onclick="showTab('add',document.querySelectorAll('.tab-btn')[3])">➕ Add New</button>
      </div>
      <div class="pg" id="prod-grid"></div>
    </div>

    <!-- ADD PRODUCT -->
    <div class="tab" id="tab-add">
      <div class="sec-eye">// New Product</div>
      <div class="sec-title">ADD <em>PRODUCT</em></div>
      <div class="add-form">
        <div class="uz" id="uz">
          <input type="file" accept="image/*" id="img-file" onchange="handleImg(this)">
          <div id="uz-content"><div class="uz-ico">📸</div><p>Click to upload product photo</p><p class="uz-sub">JPG · PNG · WEBP · Max 5MB</p></div>
        </div>
        <div class="form-row">
          <div class="fg"><label>Product Name</label><input id="a-name" type="text" placeholder="e.g. Pro Compression Shorts"></div>
          <div class="fg"><label>Category</label><select id="a-cat"><option>Tops</option><option>Bottoms</option><option>Footwear</option><option>Accessories</option><option>Sets</option><option>Outerwear</option></select></div>
          <div class="fg"><label>Price (KES)</label><input id="a-price" type="number" placeholder="2500" min="1"></div>
          <div class="fg"><label>Sizes (comma-separated)</label><input id="a-sizes" type="text" placeholder="XS, S, M, L, XL, XXL"></div>
          <div class="fg form-full"><label>Description</label><textarea id="a-desc" rows="3" placeholder="Brief product description..."></textarea></div>
          <div class="fg form-full"><button class="btn btn-p btn-lg btn-fw" id="add-btn" onclick="addProduct()">ADD PRODUCT TO STORE</button></div>
        </div>
      </div>
    </div>

    <div class="rb" id="rb"></div>
    <div class="rf">
      <button class="btn btn-g btn-fw" onclick="window.print()">🖨️ Print</button>

<div id="toast"></div>

<script>
const fmt = n => Number(n).toLocaleString('en-KE');
let orders = [], products = [], currentImg = null, orderFilter = 'all', notifications = [];

// API
async function api(path, method = 'GET', body = null) {
  try {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path,opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error ' + res.status);
    return { ok: true, data };
  } catch (e) { return { ok: false, error: e.message }; }
}

// LOGIN
document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
async function doLogin() {
  const pin = document.getElementById('pin').value;
  const { ok } = await api('/admin/login', 'POST', { pin });
  if (ok) {
    document.getElementById('login').classList.add('hide');
    document.getElementById('dash').classList.add('show');
    await loadAll();
  } else {
    document.getElementById('login-err').textContent = '❌ Wrong PIN — try again';
    document.getElementById('pin').value = '';
    document.getElementById('pin').focus();
    setTimeout(() => document.getElementById('login-err').textContent = '', 3000);
  }
}
async function doLogout() {
  await api('/admin/logout', 'POST');
  document.getElementById('login').classList.remove('hide');
  document.getElementById('dash').classList.remove('show');
  document.getElementById('pin').value = '';
}

// LOAD ALL
async function loadAll() {
  await Promise.all([loadOrders(), loadProducts(), loadNotifications()]);
  renderOverview();
}

// TABS
function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
  document.getElementById('tab-' + name).classList.add('on');
  if (btn) btn.classList.add('on');
  if (name === 'orders') renderOrdersList();
  if (name === 'products') renderProducts();
}

// OVERVIEW
function renderOverview() {
  const rev = orders.reduce((a, o) => a + (o.total || 0), 0);
  const pend = orders.filter(o => o.status === 'pending').length;
  const paid = orders.filter(o => ['paid','packed','delivered'].includes(o.status)).length;
  const counts = {};
  orders.forEach(o => JSON.parse(o.items_json || '[]').forEach(i => { if (i.name) counts[i.name] = (counts[i.name] || 0) + 1; }));
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';
  document.getElementById('stats').innerHTML = `
    <div class="sc"><div class="sc-num">${orders.length}</div><div class="sc-lbl">Total Orders</div></div>
    <div class="sc g"><div class="sc-num">KES ${fmt(rev)}</div><div class="sc-lbl">Total Revenue</div></div>
    <div class="sc o"><div class="sc-num">${pend}</div><div class="sc-lbl">Pending</div></div>
    <div class="sc g"><div class="sc-num">${paid}</div><div class="sc-lbl">Completed</div></div>
    <div class="sc"><div class="sc-num">${products.length}</div><div class="sc-lbl">Products</div></div>
    <div class="sc"><div class="sc-num" style="font-size:22px;line-height:1.3;">${best}</div><div class="sc-lbl">Best Seller</div></div>`;
  const recent = orders.slice(0, 5);
  document.getElementById('recent').innerHTML = recent.length ? recent.map(o => orderCard(o)).join('') : '<div class="empty"><h3>NO ORDERS YET</h3><p>Orders will appear here once customers buy.</p></div>';
}

// ORDERS
async function loadOrders() {
  const { ok, data } = await api('/api/orders');
  if (ok) orders = data;
}
function filterOrders(f, btn) {
  orderFilter = f;
  document.querySelectorAll('.of-btn').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  renderOrdersList();
}
function renderOrdersList() {
  const filtered = orderFilter === 'all' ? orders : orders.filter(o => o.status === orderFilter);
  document.getElementById('orders-list').innerHTML = filtered.length
    ? filtered.map(o => orderCard(o)).join('')
    : '<div class="empty"><h3>NO ORDERS</h3></div>';
}
function orderCard(o) {
  const items = JSON.parse(o.items_json || '[]');
  const date = (o.created_at || '').slice(0, 10);
  const isPickup = o.delivery_method === 'pickup_mtaani';
  const readyStatus = isPickup ? 'ready_for_collection' : 'out_for_delivery';
  const readyLabel  = isPickup ? 'READY FOR COLLECTION'  : 'OUT FOR DELIVERY';
  const doneLabel   = isPickup ? 'COLLECTED' : 'DELIVERED';
  const b = {
    pending: `<span class="badge b-p" onclick="updateStatus('${o.order_ref}','paid')">⏳ PENDING — tap to mark PAID</span>`,
    paid: `<span class="badge b-pa" onclick="updateStatus('${o.order_ref}','packed')">✓ PAID — tap to mark PACKED</span>`,
    packed: `<span class="badge b-pk" onclick="updateStatus('${o.order_ref}','dispatched')">📦 PACKED — tap to mark DISPATCHED</span>`,
    dispatched: `<span class="badge b-pk" onclick="updateStatus('${o.order_ref}','${readyStatus}')">🚀 DISPATCHED — tap to mark ${readyLabel}</span>`,
    ready_for_collection: `<span class="badge b-pk" onclick="updateStatus('${o.order_ref}','delivered')">🏬 READY FOR COLLECTION — tap to mark COLLECTED</span>`,
    out_for_delivery: `<span class="badge b-pk" onclick="updateStatus('${o.order_ref}','delivered')">🚚 OUT FOR DELIVERY — tap to mark DELIVERED</span>`,
    delivered: `<span class="badge b-d">🚚 ${doneLabel}</span>`
  }[o.status] || `<span class="badge b-p">⏳ PENDING</span>`;
  return `<div class="oc">
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
        <div class="oc-id">#${o.id}</div>${b}
        <span style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);">${date}</span>
      </div>
      <div class="oc-items">${items.map(i => i.name + (i.size ? ' (' + i.size + ')' : '')).join(', ')}</div>
      <div class="oc-meta">👤 ${o.customer_name} &nbsp;|&nbsp; 📞 ${o.customer_phone}<br>📍 ${o.delivery_address || ''}${isPickup ? ' (Pickup Mtaani: ' + (o.pickup_location || '—') + ')' : ''} &nbsp;|&nbsp; 💳 ${o.mpesa_receipt || ''}</div>
      ${notificationStrip(o)}
    </div>
    <div class="oc-right">
      <div class="oc-total">KES ${fmt(o.total)}</div>
      <button class="btn btn-g btn-sm" onclick="showReceipt('${o.order_ref}')">🧾 Receipt</button>
    </div>
  </div>`;
}
async function updateStatus(orderId, status) {
  const { ok } = await api(`/api/orders/${orderId}/status`, 'POST', { status });
  if (ok) { toast(`✅ Order #${orderId} → ${status.toUpperCase()}`); await Promise.all([loadOrders(), loadNotifications()]); renderOrdersList(); renderOverview(); }
  else toast('❌ Failed to update status');
}

// NOTIFICATIONS (SMS)
const NOTIFICATION_LABELS = {
  order_confirmed: 'Confirmed', order_dispatched: 'Dispatched',
  ready_for_collection: 'Ready', out_for_delivery: 'Out for delivery', delivered: 'Delivered'
};
async function loadNotifications() {
  const { ok, data } = await api('/api/notifications');
  if (ok) notifications = data;
}
function notificationStrip(o) {
  const rows = notifications.filter(n => n.order_id === o.id);
  if (!rows.length) return '';
  const icon = { sent: '✅', pending: '⏳', failed: '❌' };
  return `<div class="oc-sms">SMS: ${rows.map(n => {
    const label = NOTIFICATION_LABELS[n.notification_type] || n.notification_type;
    const badge = `${icon[n.status] || '•'} ${label}`;
    return n.status === 'failed'
      ? `<span class="sms-fail" title="${(n.failure_reason || '').replace(/"/g, '&quot;')}" onclick="retryNotification(${n.id})">${badge} (retry)</span>`
      : `<span>${badge}</span>`;
  }).join(' &nbsp;|&nbsp; ')}</div>`;
}
async function retryNotification(nid) {
  const { ok, data } = await api(`/api/notifications/${nid}/retry`, 'POST');
  if (ok && data.success) { toast('✅ SMS resent'); await loadNotifications(); renderOrdersList(); }
  else toast('❌ Retry failed: ' + (data?.error || 'unknown error'));
}

// PRODUCTS
async function loadProducts() {
  const { ok, data } = await api('/api/products');
  if (ok) products = data;
}
function renderProducts() {
  const grid = document.getElementById('prod-grid');
  if (!products.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>NO PRODUCTS</h3><p>Add your first product!</p></div>'; return; }
  grid.innerHTML = products.map(p => `
    <div class="pc">
      ${p.image_b64 ? `<img class="pc-img" src="${p.image_b64}" alt="${p.name}">` : '<div class="pc-ph">👕</div>'}
      <div class="pc-body">
        <div class="pc-cat">${p.category}</div>
        <div class="pc-name">${p.name}</div>
        <div class="pc-price">KES ${fmt(p.price)}</div>
        <div class="pc-sizes">Sizes: ${p.sizes || 'One Size'}</div>
        <div class="pc-foot">
          <div class="stk-tog" onclick="toggleStock(${p.id})">
            <div class="tog${p.out_of_stock ? '' : ' on'}"></div>
            <span>${p.out_of_stock ? 'Out of Stock' : 'In Stock'}</span>
          </div>
          <button class="btn btn-d btn-sm" onclick="deleteProduct(${p.id})">🗑️ Remove</button>
        </div>
      </div>
    </div>`).join('');
}
async function toggleStock(id) {
  const { ok, data } = await api(`/api/products/${id}/stock`, 'POST');
  if (ok) { await loadProducts(); renderProducts(); toast(data.out_of_stock ? 'Marked as out of stock' : 'Back in stock!'); }
}
async function deleteProduct(id) {
  if (!confirm('Remove this product from the store?')) return;
  const { ok } = await api(`/api/products/${id}`, 'DELETE');
  if (ok) { toast('🗑️ Product removed'); await loadProducts(); renderProducts(); renderOverview(); }
}

// ADD PRODUCT
function handleImg(input) {
  const file = input.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    currentImg = e.target.result;
    document.getElementById('uz-content').innerHTML = `<img src="${currentImg}" class="prev-img" alt="preview"><p style="font-size:12px;color:var(--accent);font-family:'Share Tech Mono',monospace;letter-spacing:1px;">✓ IMAGE READY</p>`;
  };
  r.readAsDataURL(file);
}
async function addProduct() {
  const name = document.getElementById('a-name').value.trim();
  const price = parseFloat(document.getElementById('a-price').value);
  if (!name) { toast('⚠ Enter product name'); return; }
  if (!price || price <= 0) { toast('⚠ Enter valid price'); return; }
  const btn = document.getElementById('add-btn');
  btn.textContent = 'Saving...'; btn.disabled = true;
  const { ok, error } = await api('/api/products', 'POST', {
    name, price,
    category: document.getElementById('a-cat').value,
    description: document.getElementById('a-desc').value.trim(),
    sizes: document.getElementById('a-sizes').value.trim() || 'One Size',
    image_b64: currentImg
  });
  if (ok) {
    toast('✅ Product added to store!');
    ['a-name', 'a-desc', 'a-price', 'a-sizes'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('img-file').value = ''; currentImg = null;
    document.getElementById('uz-content').innerHTML = '<div class="uz-ico">📸</div><p>Click to upload product photo</p><p class="uz-sub">JPG · PNG · WEBP · Max 5MB</p>';
    await loadProducts();
    renderOverview();
    showTab('products', document.querySelectorAll('.tab-btn')[2]);
  } else toast('❌ ' + (error || 'Failed to save'));
  btn.textContent = 'ADD PRODUCT TO STORE'; btn.disabled = false;
}

// RECEIPT
function showReceipt(orderRef) {
  const o = orders.find(x => x.order_ref === orderRef);

  if (!o) {
    console.error("Order not found:", orderRef);
    return;
  }

  const items = JSON.parse(o.items_json || '[]');
  document.getElementById('rb').innerHTML = `
    ${items.map(i => `<div class="rl"><span class="lbl">${i.name}${i.size ? ' (' + i.size + ')' : ''}</span><span class="val">KES ${fmt(i.price)}</span></div>`).join('')}
    <div class="rt"><span class="lbl">TOTAL</span><span class="val">KES ${fmt(o.total)}</span></div>
    <div class="rl"><span class="lbl">Order #</span><span class="val" style="color:var(--accent);font-family:'Share Tech Mono',monospace;">${o.order_ref}</span></div>
    <div class="rl"><span class="lbl">M-Pesa Code</span><span class="val" style="font-family:'Share Tech Mono',monospace;">${o.mpesa_receipt || ''}</span></div>
    <div class="rl"><span class="lbl">Customer</span><span class="val">${o.customer_name}</span></div>
    <div class="rl"><span class="lbl">Phone</span><span class="val">${o.customer_phone}</span></div>
    <div class="rl"><span class="lbl">Deliver To</span><span class="val">${o.delivery_address || ''}</span></div>
    <div class="rl"><span class="lbl">Status</span><span class="val">${o.status.toUpperCase()}</span></div>
    <div class="rl"><span class="lbl">Date</span><span class="val">${(o.created_at || '').slice(0, 10)}</span></div>`;
  document.getElementById('receipt-modal').classList.add('open');
}
function closeReceipt() { document.getElementById('receipt-modal').classList.remove('open'); }

// TOAST
let _tt= null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
