<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--bg2:#0e0e0d;--bg3:#161513;--bg4:#201f1c;
  --border:rgba(212,175,55,.14);--border2:rgba(255,255,255,.08);
  --text:#F5F1E6;--muted:rgba(245,241,230,.5);--muted2:rgba(245,241,230,.72);
  --accent:#D4AF37;--accent-light:#F4D76A;--red:#ff4d4d;--green:#00e29a;--wa:#25D366;
  --accent-glow:rgba(212,175,55,.45);
  --gold-grad:linear-gradient(135deg,#F4D76A 0%,#D4AF37 45%,#a9821f 100%);
  --glass:rgba(10,10,9,.6);
  --shadow-lux:0 20px 60px rgba(0,0,0,.55);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden;}

/* ── LOADER ── */
#loader{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s;}
#loader.out{opacity:0;visibility:hidden;}
#loader img{width:160px;animation:lPulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(212,175,55,.45));}
@keyframes lPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);filter:drop-shadow(0 0 50px var(--accent-glow));}}
.ld-dots{display:flex;gap:8px;margin-top:32px;}
.ld-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ldot .9s ease-in-out infinite;}
.ld-dot:nth-child(2){animation-delay:.2s;}
.ld-dot:nth-child(3){animation-delay:.4s;}
@keyframes ldot{0%,100%{transform:translateY(0);opacity:.3;}50%{transform:translateY(-12px);opacity:1;}}

/* ── SPORTS BACKGROUND CANVAS ── */
#bg-canvas{position:fixed;inset:0;z-index:0;opacity:.06;pointer-events:none;}

/* ── PROMO BAR ── */
.promo{background:var(--accent);color:#000;text-align:center;padding:8px 16px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;position:relative;z[...]
